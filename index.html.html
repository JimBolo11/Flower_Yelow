<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 🌻</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:linear-gradient(#071b12 0%,#123d20 55%,#07150d 100%);
  font-family:Georgia,serif;
  color:#fff;
}
.scene{position:relative;width:100%;height:100%;overflow:hidden}
.moon{
  position:absolute;top:8%;right:10%;width:75px;height:75px;border-radius:50%;
  background:#fff8c7;box-shadow:0 0 45px #fff3a6;
  opacity:.9;
}
.stars{position:absolute;inset:0}
.star{
  position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;
  animation:twinkle 2s infinite alternate;
}
@keyframes twinkle{from{opacity:.2;transform:scale(.6)}to{opacity:1;transform:scale(1.5)}}

.ground{
  position:absolute;bottom:-8%;left:-5%;width:110%;height:28%;
  background:#06110a;border-radius:50% 50% 0 0;
}
.message{
  position:absolute;top:8%;left:50%;transform:translateX(-50%);
  width:90%;text-align:center;z-index:5;
  text-shadow:0 2px 10px #000;
}
.message h1{
  margin:0;font-size:clamp(27px,7vw,52px);
  color:#ffe85a;
  animation:glow 2s ease-in-out infinite alternate;
}
.message p{font-size:clamp(16px,4vw,23px);margin:10px 0;color:#fff8d0;line-height:1.45}
.message .romantic{font-size:clamp(14px,3.5vw,20px);max-width:900px;margin:12px auto;color:#fffbe2}
@keyframes glow{from{text-shadow:0 0 5px #ffd000}to{text-shadow:0 0 25px #ffd000,0 0 45px #ffb300}}

.flower{
  position:absolute;bottom:9%;width:150px;height:230px;
  transform-origin:bottom center;animation:sway 4s ease-in-out infinite;
  z-index:3;
}
@keyframes sway{
  0%,100%{transform:rotate(-2deg)}
  50%{transform:rotate(3deg)}
}
.stem{
  position:absolute;bottom:0;left:74px;width:7px;height:170px;
  background:linear-gradient(90deg,#174d21,#55a934,#174d21);
  border-radius:10px;
}
.leaf{
  position:absolute;width:55px;height:25px;background:#32912f;
  border-radius:100% 0 100% 0;
}
.leaf.left{left:22px;bottom:65px;transform:rotate(22deg)}
.leaf.right{left:78px;bottom:105px;transform:scaleX(-1) rotate(22deg)}

.head{
  position:absolute;left:25px;top:0;width:100px;height:100px;
  border-radius:50%;animation:bloom 2.2s ease-out both;
}
.petal{
  position:absolute;left:35px;top:3px;width:30px;height:50px;
  background:linear-gradient(#fff36b,#ffd21c);
  border-radius:55% 55% 45% 45%;
  transform-origin:15px 47px;
  box-shadow:0 0 8px rgba(255,218,40,.35);
}
.center{
  position:absolute;left:31px;top:31px;width:38px;height:38px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#9b5b0b,#4b2506 70%);
  box-shadow:0 0 12px rgba(255,180,0,.5);
  z-index:2;
}
@keyframes bloom{
  from{transform:scale(.05) rotate(-20deg);opacity:0}
  to{transform:scale(1) rotate(0);opacity:1}
}

.firefly{
  position:absolute;width:5px;height:5px;border-radius:50%;background:#fff27a;
  box-shadow:0 0 12px #ffe95c;
  animation:fly 7s linear infinite;
}
@keyframes fly{
  0%{transform:translate(0,30px);opacity:0}
  15%{opacity:1}
  50%{transform:translate(70px,-90px)}
  85%{opacity:1}
  100%{transform:translate(-50px,-160px);opacity:0}
}
.bottom{
  position:absolute;bottom:3%;left:50%;transform:translateX(-50%);
  z-index:8;text-align:center;font-size:14px;color:#fffbd2;opacity:.9;
}
</style>
</head>
<body>
<div class="scene">
  <div class="moon"></div>
  <div class="stars" id="stars"></div>
  <div class="message">
    <h1>Para ti 🌻</h1>
    <p>Feliz día de las flores amarillas 🌻</p>
<p class="romantic">
  Quizá no lo esperabas de mí, pero hay detalles que simplemente nacen del corazón.<br>
  Dicen que a las niñas bonitas se les consiente, pero tú mereces mucho más:<br>
  flores tan bonitas como la mujer que las inspira. 💛
</p>
  </div>
  <div id="flowers"></div>
  <div id="fireflies"></div>
  <div class="ground"></div>
  <div class="bottom">Con cariño, para alguien muy especial ✨</div>
</div>

<script>
const stars=document.getElementById('stars');
for(let i=0;i<55;i++){
  const s=document.createElement('span');
  s.className='star';
  s.style.left=Math.random()*100+'%';
  s.style.top=Math.random()*70+'%';
  s.style.animationDelay=(Math.random()*2)+'s';
  stars.appendChild(s);
}

const flowers=document.getElementById('flowers');
const positions=[
  {x:8,b:5,s:.75,d:.2},{x:25,b:7,s:1,d:.8},{x:43,b:5,s:1.15,d:0},
  {x:62,b:6,s:.9,d:1.1},{x:78,b:8,s:.72,d:.4}
];

positions.forEach(o=>{
  const f=document.createElement('div');
  f.className='flower';
  f.style.left=o.x+'%';
  f.style.bottom=o.b+'%';
  f.style.transform=`scale(${o.s})`;
  f.style.animationDelay=o.d+'s';

  const stem=document.createElement('div'); stem.className='stem';
  const l1=document.createElement('div'); l1.className='leaf left';
  const l2=document.createElement('div'); l2.className='leaf right';
  const head=document.createElement('div'); head.className='head';

  for(let i=0;i<12;i++){
    const p=document.createElement('div');
    p.className='petal';
    p.style.transform=`rotate(${i*30}deg)`;
    head.appendChild(p);
  }
  const c=document.createElement('div'); c.className='center'; head.appendChild(c);

  f.append(stem,l1,l2,head);
  flowers.appendChild(f);
});

const fireflies=document.getElementById('fireflies');
for(let i=0;i<18;i++){
  const f=document.createElement('span');
  f.className='firefly';
  f.style.left=(Math.random()*100)+'%';
  f.style.top=(45+Math.random()*45)+'%';
  f.style.animationDelay=(Math.random()*7)+'s';
  f.style.animationDuration=(5+Math.random()*5)+'s';
  fireflies.appendChild(f);
}
</script>
</body>
</html>
